services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis-data:/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes: [minio-data:/data]
    ports: ["127.0.0.1:9000:9000", "9001:9001"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command: ["until mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY; do sleep 2; done; mc mb --ignore-existing local/eduverse-recordings"]
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    depends_on: [redis]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [./livekit.yaml:/etc/livekit.yaml:ro]
    ports: ["7881:7881", "50000-50100:50000-50100/udp"]

  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    cap_add: [SYS_ADMIN]
    depends_on: [livekit, redis, minio]
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes: [./egress.yaml:/etc/egress.yaml:ro]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [livekit, minio]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
